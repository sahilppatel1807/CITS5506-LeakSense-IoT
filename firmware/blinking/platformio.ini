; PlatformIO build configuration for the FireBeetle ESP32-E firmware.
; These settings select the target board, Arduino framework, Serial monitor
; speed, and the display/environment sensor libraries used by main.cpp.
[env:firebeetle2_esp32e]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200

; Libraries required for the OLED display and BME280 atmospheric sensor.
lib_deps =
  adafruit/Adafruit GFX Library @ ^1.12.1
  adafruit/Adafruit SSD1306 @ ^2.5.15
  adafruit/Adafruit BME280 Library @ ^2.3.0

; Project: LeakSense - Smart LPG Gas Leakage Detection and Automatic Safety System
